<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 下单助手 · PayPal AI Hackathon</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f5f7fa; color: #222; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  header { text-align: center; padding: 12px 0; }
  header h1 { font-size: 20px; margin: 0; }
  header p { font-size: 12px; color: #888; margin: 4px 0 0; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px;
           background:#fff3cd; color:#856404; margin-left:6px; }
  #chat { background:#fff; border-radius:12px; height:52vh; min-height:300px;
          overflow-y:auto; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .msg { margin:8px 0; max-width:85%; padding:10px 12px; border-radius:12px;
         font-size:14px; line-height:1.6; white-space:pre-wrap; }
  .user { background:#0070f3; color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .bot { background:#eef1f5; border-bottom-left-radius:4px; }
  .actions { margin-top:8px; }
  .actions a, .actions button { display:inline-block; margin:4px 6px 0 0; padding:8px 14px;
      border-radius:8px; font-size:13px; text-decoration:none; cursor:pointer; border:0; }
  .pay { background:#0070f3; color:#fff; }
  .cap { background:#00a86b; color:#fff; }
  #form { display:flex; margin-top:12px; gap:8px; }
  #input { flex:1; padding:12px; border:1px solid #ddd; border-radius:10px; font-size:14px; }
  #send { padding:0 20px; border:0; border-radius:10px; background:#111; color:#fff; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 下单助手 {% if mock_paypal or mock_llm %}<span class="badge">演示模式</span>{% endif %}</h1>
    <p>PayPal 沙箱 × AI · 跟 AI 说话就能下单</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="比如：买两杯拿铁 / 看菜单 / 退款">
    <button id="send" type="submit">发送</button>
  </form>
</div>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');

function addMsg(text, cls, actions) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if (actions) {
    const wrap = document.createElement('div');
    wrap.className = 'actions';
    actions.forEach(a => {
      let el;
      if (a.href) { el = document.createElement('a'); el.href = a.href; el.target = '_blank'; }
      else { el = document.createElement('button'); el.type = 'button'; el.onclick = a.onclick; }
      el.textContent = a.label; el.className = a.cls || '';
      wrap.appendChild(el);
    });
    d.appendChild(wrap);
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function send(text) {
  addMsg(text, 'user');
  input.value = '';
  const r = await fetch('/api/chat', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });
  const data = await r.json();
  const actions = [];
  if (data.approve_url && data.order_id) {
    if (data.mock) {
      actions.push({label: '模拟买家确认付款', href: data.approve_url, cls: 'pay'});
    } else {
      actions.push({label: '去 PayPal 沙箱付款', href: data.approve_url, cls: 'pay'});
    }
    actions.push({label: '我已付款，确认收款', cls: 'cap', onclick: () => capture(data.order_id)});
  }
  addMsg(data.reply, 'bot', actions.length ? actions : null);
}

async function capture(order_id) {
  const r = await fetch('/api/capture', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({order_id})
  });
  const data = await r.json();
  addMsg(data.ok ? data.reply : ('收款失败：' + data.error), 'bot');
}

form.onsubmit = e => { e.preventDefault(); const t = input.value.trim(); if (t) send(t); };
addMsg('你好！我是 AI 下单助手。说“买两杯拿铁”我就帮你走 PayPal 下单；说“看菜单”看全部商品。', 'bot');
</script>
</body>
</html>
